Neos:
  Neos:
    userInterface:
      translation:
        autoInclude:
          'NEOSidekick.LinkChecker': ['Modules']
    modules:
      management:
        submodules:
          link-checker:
            label: 'NEOSidekick.LinkChecker:Modules:module.label'
            description: 'NEOSidekick.LinkChecker:Modules:module.description'
            icon: 'fas fa-link'
            controller: NEOSidekick\LinkChecker\Controller\Backend\ModuleController
            resource: 'NEOSidekick.LinkChecker:Backend.Module'
            additionalResources:
              styleSheets:
                - 'resource://NEOSidekick.LinkChecker/Public/Styles/link-checker.css'
    fusion:
      autoInclude:
        NEOSidekick.LinkChecker: true

Flowpack:
  JobQueue:
    Common:
      queues:
        'NEOSidekick.LinkChecker.Crawl':
          preset: 'NEOSidekick.LinkChecker.Crawl'

      presets:
        'NEOSidekick.LinkChecker.Crawl':
          className: 'Flowpack\JobQueue\Doctrine\Queue\DoctrineQueue'
          maximumNumberOfReleases: 2
          options:
            tableName: 'neosidekick_linkchecker_jobqueue_crawl'
            defaultTimeout: 60
            pollInterval: 1
            boostPollInterval: 0.2
            boostTime: 10
          releaseOptions:
            delay: 300

NEOSidekick:
  LinkChecker:
    # how many concurrent requests should the command controller perform
    # If set too high, you most DOS your server
    concurrency: 10
    ignoreRobots: false
    excludeStatusCodes: []

    excludeUrls: []

    # Regex rules (full patterns incl. delimiters) that suppress matching findings entirely.
    # Each entry is either a pattern string or {pattern: '/.../', statusCodes: [404]}.
    ignoreRules: []

    # Reduce false positives by classifying unverifiable results as warnings instead of broken links.
    classification:
      # Auth walls, bot blocks and rate limiting cannot be verified and must not count as broken.
      treatAsWarning: [401, 403, 429]
      # Treat Cloudflare bot challenges (detected via cf-mitigated / cf-ray headers) as warnings.
      detectCloudflareChallenge: true
      # Hosts that routinely block crawlers. Findings for these are downgraded to warnings.
      knownBlockerDomains:
        - 'linkedin.com'
        - 'x.com'
        - 'twitter.com'
        - 'instagram.com'
        - 'facebook.com'
        - 'youtube.com'
        - 'play.google.com'
        - 'drive.google.com'

    # Performance & scale: avoid downloading bodies you don't need and avoid re-checking links you
    # already verified.
    performance:
      # Cap the number of body bytes read per crawled page (bounds memory on large documents).
      maximumResponseSize: 2097152
      # Use HEAD instead of GET for external links (only their status is needed), with an automatic
      # GET fallback for servers that reject HEAD. Internal pages always use GET for link discovery.
      headFirst: true
      # Byte range cap for external requests so a link to a huge PDF/video is not fully downloaded.
      externalRangeBytes: 65536
      # Rate limit per external host (requests/second); 0 disables it. The site's own host is
      # governed by `concurrency` above instead.
      perHostRequestsPerSecond: 4
      # Skip re-requesting external links that were confirmed healthy on a recent run.
      betweenRunCache:
        enabled: false
        okLifetime: 604800

    # Only re-check content nodes that changed since the last incremental run. Opt-in via the
    # `--only-changed` flag; note it can miss links broken by changes on the *target* side.
    incremental:
      enabled: false

    clientOptions:
      retryAttempts: 2
      cookies: true
      connectionTimeout: 10
      timeout: 10
      # Follow redirects so a 301/302 to a working page is not reported as broken.
      allowRedirects: true
      maxRedirects: 5
      # Honest, descriptive user agent. Some servers block the default Guzzle UA.
      userAgent: 'NEOSidekickLinkChecker/1.0 (+https://neosidekick.com/)'
      auth: []

    notifications:
      enabled: false
      service: NEOSidekick\LinkChecker\Infrastructure\EmailService
      subject: 'Link checker results'
      mail:
        sender:
          default:
            name: 'CodeQ'
            address: 'no-reply@example.com'
        recipient:
          default:
            name: 'CodeQ'
            address: 'test@example.com'
        ccRecipient: []
        template:
          package: 'NEOSidekick.LinkChecker'
          file: 'NotificationMail'
        logging:
          errors: log
          success: log
